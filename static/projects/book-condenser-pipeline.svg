<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Book Condenser pipeline: parse the source, build an analytical map, select verbatim passages, control length and completeness, then render a reading edition.">
  <rect x="0" y="0" width="1100" height="360" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="bc-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7b"/>
    </marker>
  </defs>

  <!-- Stage boxes: width 180, step 208, start 36 -->
  <g>
    <rect x="36"  y="120" width="180" height="98" rx="12" fill="#eef2f7" stroke="#c7d2de"/>
    <rect x="244" y="120" width="180" height="98" rx="12" fill="#eef2f7" stroke="#c7d2de"/>
    <rect x="452" y="120" width="180" height="98" rx="12" fill="#fbecd9" stroke="#e6b877"/>
    <rect x="660" y="120" width="180" height="98" rx="12" fill="#eef2f7" stroke="#c7d2de"/>
    <rect x="868" y="120" width="196" height="98" rx="12" fill="#e3ede4" stroke="#a9c6ac"/>
  </g>

  <!-- Arrows between boxes -->
  <g stroke="#5b6b7b" stroke-width="2.6" marker-end="url(#bc-arrow)">
    <line x1="218" y1="169" x2="240" y2="169"/>
    <line x1="426" y1="169" x2="448" y2="169"/>
    <line x1="634" y1="169" x2="656" y2="169"/>
    <line x1="842" y1="169" x2="864" y2="169"/>
  </g>

  <!-- Labels -->
  <g fill="#1f2933" text-anchor="middle">
    <text x="126" y="153" font-size="18" font-weight="700">Parse</text>
    <text x="126" y="179" font-size="12.5" fill="#5b6b7b">source book</text>
    <text x="126" y="198" font-size="12.5" fill="#5b6b7b">EPUB · PDF · DOCX</text>

    <text x="334" y="153" font-size="18" font-weight="700">Analytical map</text>
    <text x="334" y="179" font-size="12.5" fill="#5b6b7b">question · thesis</text>
    <text x="334" y="198" font-size="12.5" fill="#5b6b7b">argument · evidence</text>

    <text x="542" y="153" font-size="18" font-weight="700">Select</text>
    <text x="542" y="179" font-size="12.5" fill="#8a5a1a">verbatim</text>
    <text x="542" y="198" font-size="12.5" fill="#8a5a1a">passages</text>

    <text x="750" y="153" font-size="18" font-weight="700">Control</text>
    <text x="750" y="179" font-size="12.5" fill="#5b6b7b">length · redundancy</text>
    <text x="750" y="198" font-size="12.5" fill="#5b6b7b">completeness</text>

    <text x="966" y="153" font-size="18" font-weight="700">Reading edition</text>
    <text x="966" y="179" font-size="12.5" fill="#3f6b45">PDF · Markdown</text>
    <text x="966" y="198" font-size="12.5" fill="#3f6b45">omissions marked</text>
  </g>

  <!-- Title + notes -->
  <text x="550" y="56" font-size="22" font-weight="700" fill="#1f2933" text-anchor="middle">Read less of the book — without replacing it with a summary</text>
  <text x="550" y="84" font-size="14" fill="#5b6b7b" text-anchor="middle">The author's original prose is preserved; any editorial bridge between passages is labelled, never disguised as the source.</text>

  <text x="550" y="284" font-size="13.5" fill="#5b6b7b" text-anchor="middle" font-style="italic">Extractive, not generative — the model chooses what to keep, it does not rewrite.</text>
</svg>
